<!DOCTYPE html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1117" />
    <meta name="description" content="MarkRead Live — Eye-comfort dark mode Markdown live previewer and distraction-free reader with native Web Speech read aloud." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>" />
    <title>MarkRead Live — Markdown Live Preview & Reader</title>
    <!-- Pre-mount dark theme script to avoid FOUC (flash of unstyled content) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('markread_theme');
          var theme = saved ? JSON.parse(saved) : 'dark';
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-textPrimary antialiased selection:bg-sky-500/20 selection:text-sky-300 min-h-screen h-full flex flex-col">
    <div id="root" class="h-full flex flex-col flex-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
